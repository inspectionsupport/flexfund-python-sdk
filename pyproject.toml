[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flexfund-sdk"
version = "1.0.0"
description = "Python SDK for the FlexFund REST API (v20260322)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "mypy",
    "ruff",
    "mkdocs-material",
    "mkdocstrings[python]",
    "fastapi",
    "anyio",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flexfund"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["flexfund"]

# Generated code is not wrapped the way ruff would, so long lines are fine there.
[tool.ruff.lint.per-file-ignores]
"src/flexfund/models/**" = ["E501"]
"src/flexfund/enums/**" = ["E501"]
"src/flexfund/resources/**" = ["E501"]
"src/flexfund/_generated_client.py" = ["E501"]
"src/flexfund/_api_version.py" = ["E501"]
"tests/generated/**" = ["E501"]

[tool.ruff.format]
exclude = [
    "src/flexfund/models/**",
    "src/flexfund/enums/**",
    "src/flexfund/resources/**",
    "src/flexfund/_generated_client.py",
    "src/flexfund/_api_version.py",
    "tests/generated/**",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests/typing"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
