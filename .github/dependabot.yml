# Keeps the pinned action SHAs in .github/workflows and the uv lockfile current. Library
# dependency ranges in pyproject.toml are deliberately loose; this only moves the lockfile
# that CI and contributors install from.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
