name: CI

on:
  push:
  pull_request:

# Nothing here writes to the repository, so the token can only read it. Never add a
# pull_request_target trigger that checks out PR code: it would run a fork's code with secrets.
permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      # tests/live auto-skips unless FLEXFUND_LIVE_* are set.
      - name: pytest
        run: uv run pytest

      # One Python version is enough for the docs build.
      - name: mkdocs build --strict
        if: matrix.python-version == '3.12'
        run: uv run mkdocs build --strict
